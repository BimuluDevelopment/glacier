# Glacier Panel: static web app + API reverse proxy.
# Copy to /etc/nginx/sites-available/glacier.conf, replace panel.example.com, then run
#   certbot --nginx -d panel.example.com
# which adds the HTTPS server block and the HTTP -> HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;

    root /opt/glacier/apps/web/dist;
    index index.html;

    # Egg imports and file uploads.
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The installer, so new nodes can run: curl -fsSL https://panel.example.com/install.sh | sudo bash -s -- daemon ...
    location = /install.sh {
        alias /opt/glacier/installer/install.sh;
        default_type text/x-shellscript;
    }

    # Hashed build assets never change; cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/admin/nodes, /server/abc123, ...) all serve the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
